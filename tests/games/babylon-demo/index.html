<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Babylon.js 3D Demo - Goat WebView</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        position: fixed;
        inset: 0;
        width: 100%; height: 100%; height: 100dvh;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        margin: 0; padding: 0;
        background: #050515;
        overscroll-behavior: none;
      }
      #app {
        position: absolute;
        inset: 0;
        width: 100%; height: 100%;
        overflow: hidden;
      }
      #babylon-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="babylon-canvas"></canvas>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
