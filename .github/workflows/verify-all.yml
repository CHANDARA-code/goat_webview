name: Goat WebView Master CI Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify-android:
    name: Android Core & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Run Android Core Unit Tests
        run: |
          chmod +x scripts/verify-android.sh
          ./scripts/verify-android.sh

  verify-ios:
    name: iOS Swift Package Tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Run iOS Verification
        run: |
          chmod +x scripts/verify-ios.sh
          ./scripts/verify-ios.sh

  verify-react-native:
    name: React Native TurboModule Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-native/package-lock.json
      - name: Run React Native Verification
        run: |
          chmod +x scripts/verify-rn.sh
          ./scripts/verify-rn.sh

  verify-flutter:
    name: Flutter PlatformView Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true
      - name: Run Flutter Verification
        run: |
          chmod +x scripts/verify-flutter.sh
          ./scripts/verify-flutter.sh

  verify-web:
    name: Web JS SDK & Mini-App Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miniapp-web/package-lock.json
      - name: Run Web Verification
        run: |
          chmod +x scripts/verify-web.sh
          ./scripts/verify-web.sh

  all-checks-pass:
    name: All Platform Checks Passed
    runs-on: ubuntu-latest
    needs: [verify-android, verify-ios, verify-react-native, verify-flutter, verify-web]
    steps:
      - name: Confirm All Checks Passed
        run: echo "All platform checks passed"

